services:
  # 1. PostgreSQL Database
  - type: postgres
    name: health-postgres-db
    databaseName: healthdb
    user: postgres
    plan: free

  # 2. Spring Boot Backend Service
  - type: web
    name: smarthealth-backend
    env: docker
    dockerfilePath: docker/backend.Dockerfile
    context: backend
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: health-postgres-db
          property: connectionString
      - key: JWT_SECRET
        value: 9a8f7e6d5c4b3a210987654321fedcba9a8f7e6d5c4b3a210987654321fedcba
    plan: free

  # 3. React Frontend Web Application
  - type: web
    name: smarthealth-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
