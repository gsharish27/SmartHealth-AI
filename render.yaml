databases:
  - name: health-postgres-db
    databaseName: healthdb
    user: health_db_user
    plan: free

services:
  # Spring Boot Backend Web Service
  - type: web
    name: smarthealth-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: health-postgres-db
          property: connectionString
      - key: JWT_SECRET
        value: 9a8f7e6d5c4b3a210987654321fedcba9a8f7e6d5c4b3a210987654321fedcba
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
